<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Sport - Презентация</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #161b22; 
            padding: 40px 30px; 
            border-radius: 16px; 
            border: 1px solid #30363d; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
        }
        
        h1 { color: #f0f6fc; font-size: 28px; margin-bottom: 40px; }
        
        .game-section { margin-bottom: 50px; }
        
        .game-title { 
            color: #f0f6fc; 
            font-size: 22px; 
            margin-bottom: 20px; 
            font-weight: 600; 
        }
        
        /* --- Стили для карусели --- */
        .carousel-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }
        
        .carousel-track {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
            border-radius: 12px;
        }
        
        .carousel-track::-webkit-scrollbar { display: none; }

        .carousel-slide {
            min-width: 100%;
            scroll-snap-align: center;
            border-radius: 12px;
            border: 1px solid #30363d;
            background: #000;
            display: block;
            object-fit: cover;
            cursor: pointer; /* Курсор-рука для клика */
            transition: transform 0.2s;
        }
        
        .carousel-slide:hover { transform: scale(1.01); }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(13, 17, 23, 0.7);
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .carousel-btn:hover { background: rgba(48, 54, 61, 0.9); color: #fff; }
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }

        /* --- Видео и разделитель --- */
        video { 
            width: 100%; 
            max-width: 100%; 
            height: auto; 
            border-radius: 12px; 
            border: 1px solid #30363d; 
            background: #000; 
            display: block; 
            margin: 0 auto; 
        }
        
        .divider { 
            height: 1px; 
            background-color: #30363d; 
            border: none; 
            margin: 50px 0; 
        }

        /* ========================================= */
        /* --- СТИЛИ ДЛЯ ПОЛНОЭКРАННОЙ ГАЛЕРЕИ --- */
        /* ========================================= */
        .lightbox {
            display: none; 
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .lightbox-close, .lightbox-prev, .lightbox-next {
            position: absolute;
            color: #fff;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            user-select: none;
        }

        .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,0.3); }

        .lightbox-close {
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            font-size: 30px;
        }

        .lightbox-prev, .lightbox-next {
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            font-size: 30px;
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        @media (max-width: 600px) {
            .lightbox-prev, .lightbox-next { width: 40px; height: 40px; font-size: 20px; }
            .lightbox-close { width: 40px; height: 40px; font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Iron Sport</h1>

        <!-- ================= БЛОК СКРИНШОТОВ (КАРУСЕЛЬ) ================= -->
        <div class="game-section">
            <h2 class="game-title">Скриншоты</h2>
            
            <div class="carousel-container">
                <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
                
                <!-- Трек с картинками -->
                <div class="carousel-track" id="slider">
                    <!-- Добавлены onclick события для открытия галереи -->
                    <img src="https://github.com/AMA-gd/IronSport/releases/download/1.0/1.png" class="carousel-slide" alt="Скриншот 1" onclick="openLightbox(0)">
                    <img src="https://github.com/AMA-gd/IronSport/releases/download/1.0/2.png" class="carousel-slide" alt="Скриншот 2" onclick="openLightbox(1)">
                    <img src="https://github.com/AMA-gd/IronSport/releases/download/1.0/3.png" class="carousel-slide" alt="Скриншот 3" onclick="openLightbox(2)">
                    <img src="https://github.com/AMA-gd/IronSport/releases/download/1.0/4.png" class="carousel-slide" alt="Скриншот 4" onclick="openLightbox(3)">
                    <img src="https://github.com/AMA-gd/IronSport/releases/download/1.0/5.png" class="carousel-slide" alt="Скриншот 5" onclick="openLightbox(4)">
                    <img src="https://github.com/AMA-gd/IronSport/releases/download/1.0/6.png" class="carousel-slide" alt="Скриншот 6" onclick="openLightbox(5)">
                    <img src="https://github.com/AMA-gd/IronSport/releases/download/1.0/7.png" class="carousel-slide" alt="Скриншот 7" onclick="openLightbox(6)">
                    <img src="https://github.com/AMA-gd/IronSport/releases/download/1.0/8.png" class="carousel-slide" alt="Скриншот 8" onclick="openLightbox(7)">
                </div>
                
                <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
            </div>
            
            <hr class="divider">
        </div>

        <!-- ================= БЛОК ИГРОВОГО ПРОЦЕССА ================= -->
        <div class="game-section">
            <h2 class="game-title">Игровой процесс</h2>
            
            <video src="https://github.com/AMA-gd/IronSport/releases/download/1.0/Gameplay.mp4" controls preload="metadata" poster="https://github.com/AMA-gd/IronSport/releases/download/1.0/Poster.png"></video>
        </div>

    </div>

    <!-- ================= ПОЛНОЭКРАННАЯ ГАЛЕРЕЯ (LIGHTBOX) ================= -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-prev" onclick="changeLightboxImage(-1)">&#10094;</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="Увеличенный скриншот">
        <button class="lightbox-next" onclick="changeLightboxImage(1)">&#10095;</button>
    </div>

    <!-- ================= СКРИПТЫ ================= -->
    <script>
        // --- Логика обычной карусели ---
        function moveSlide(direction) {
            const slider = document.getElementById('slider');
            const slideWidth = slider.clientWidth; 
            slider.scrollBy({
                left: direction * slideWidth,
                behavior: 'smooth'
            });
        }

        // --- Логика полноэкранной галереи (Lightbox) ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        
        // Получаем все картинки из карусели
        const carouselImages = document.querySelectorAll('.carousel-slide');
        let currentImageIndex = 0;

        function openLightbox(index) {
            currentImageIndex = index;
            lightboxImg.src = carouselImages[index].src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Запрещаем скролл фона
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto'; // Возвращаем скролл
            
            // Синхронизация: прокручиваем основную карусель к той картинке, на которой закрыли
            const slider = document.getElementById('slider');
            slider.scrollTo({ left: currentImageIndex * slider.clientWidth, behavior: 'smooth' });
        }

        function changeLightboxImage(direction) {
            currentImageIndex += direction;
            
            // Если дошли до конца, переключаемся на начало (циклично)
            if (currentImageIndex >= carouselImages.length) currentImageIndex = 0;
            if (currentImageIndex < 0) currentImageIndex = carouselImages.length - 1;
            
            lightboxImg.src = carouselImages[currentImageIndex].src;
        }

        // Закрытие по клику на темный фон
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) closeLightbox();
        });

        // Управление с клавиатуры (стрелки и Esc)
        document.addEventListener('keydown', function(e) {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') changeLightboxImage(-1);
            if (e.key === 'ArrowRight') changeLightboxImage(1);
        });
    </script>
</body>
</html>
