<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Sport - Презентация</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #161b22; 
            padding: 40px 30px; 
            border-radius: 16px; 
            border: 1px solid #30363d; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
        }
        
        h1 { color: #f0f6fc; font-size: 28px; margin-bottom: 40px; }
        
        .game-section { margin-bottom: 50px; }
        
        .game-title { 
            color: #f0f6fc; 
            font-size: 22px; 
            margin-bottom: 20px; 
            font-weight: 600; 
        }
        
        /* --- Стили для карусели --- */
        .carousel-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }
        
        .carousel-track {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -ms-overflow-style: none;  /* Скрываем скроллбар в IE и Edge */
            scrollbar-width: none;  /* Скрываем скроллбар в Firefox */
            border-radius: 12px;
        }
        
        /* Скрываем скроллбар в Chrome/Safari */
        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .carousel-slide {
            min-width: 100%;
            scroll-snap-align: center;
            border-radius: 12px;
            border: 1px solid #30363d;
            background: #000;
            display: block;
            object-fit: cover;
        }

        /* Кнопки навигации */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(13, 17, 23, 0.7);
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .carousel-btn:hover { background: rgba(48, 54, 61, 0.9); color: #fff; }
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }

        /* --- Видео и разделитель --- */
        video { 
            width: 100%; 
            max-width: 100%; 
            height: auto; 
            border-radius: 12px; 
            border: 1px solid #30363d; 
            background: #000; 
            display: block; 
            margin: 0 auto; 
        }
        
        .divider { 
            height: 1px; 
            background-color: #30363d; 
            border: none; 
            margin: 50px 0; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Iron Sport</h1>

        <!-- ================= БЛОК СКРИНШОТОВ (КАРУСЕЛЬ) ================= -->
        <div class="game-section">
            <h2 class="game-title">Скриншоты</h2>
            
            <div class="carousel-container">
                <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
                
                <!-- Трек с картинками -->
                <div class="carousel-track" id="slider">
                    <!-- Замени ссылки ниже на свои картинки. Для GitHub Pages лучше положить их в папку с index.html -->
                    <img src="ССЫЛКА_НА_СКРИНШОТ_1.jpg" class="carousel-slide" alt="Скриншот 1">
                    <img src="ССЫЛКА_НА_СКРИНШОТ_2.jpg" class="carousel-slide" alt="Скриншот 2">
                    <img src="ССЫЛКА_НА_СКРИНШОТ_3.jpg" class="carousel-slide" alt="Скриншот 3">
                </div>
                
                <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
            </div>
            
            <hr class="divider">
        </div>

        <!-- ================= БЛОК ИГРОВОГО ПРОЦЕССА ================= -->
        <div class="game-section">
            <h2 class="game-title">Игровой процесс</h2>
            
            <video src="https://github.com/AMA-gd/Iron-Sport/releases/download/1.0/Trailer.mp4" controls preload="metadata" poster="ССЫЛКА_НА_ПОСТЕР.jpg"></video>
        </div>

    </div>

    <!-- Скрипт для работы стрелочек карусели -->
    <script>
        function moveSlide(direction) {
            const slider = document.getElementById('slider');
            // Вычисляем ширину одного слайда (включая отступы, если они есть)
            const slideWidth = slider.clientWidth; 
            
            // Прокручиваем контейнер влево или вправо
            slider.scrollBy({
                left: direction * slideWidth,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
